  "yes": "yes"
  "no": "no"
  info:
    - "<gold>Arena <white><arena></white>"
    - "<gray>World: <white><world></white>, open: <white><enabled></white>"
    - "<gray>Lobby: <white><lobby></white>, hunters: <white><hunter></white>"
    - "<gray>Prop spawns: <white><spawns></white>, region: <white><region></white>, blocks: <white><blocks></white>"
    - "<gray>Players: <white><players></white>, hunters: <white><hunters></white>, hide / seek: <white><times></white> s"
    - "<gray>Own settings: <white><overrides></white>"
    - "<gray>Missing: <white><problems></white>"
list:
  header: "<pfx>Arenas:"
  entry: "<gray>- <white><arena></white>: <state>, players <white><count>/<max></white>"
phase:
  waiting: "waiting for players"
  starting: "starting soon"
  hiding: "props are hiding"
  seeking: "hunt in progress"
  ending: "round over"
  disabled: "closed"
help:
  player:
    - "<gold>PropHunt"
    - "<white>/ph join [arena]</white> <gray>- join a game"
    - "<white>/ph leave</white> <gray>- leave and get your items back"
    - "<white>/ph list</white> <gray>- list arenas"
  admin:
    - "<gold>Arena setup"
    - "<white>/ph create <arena-name></white> <gray>- create in the current world"
    - "<white>/ph setlobby | sethunterspawn | addspawn | clearspawns <arena-name></white> <gray>- points at your position"
    - "<white>/ph pos1 | pos2 | clearregion <arena-name></white> <gray>- map borders (optional)"
    - "<white>/ph addblock <arena-name> [block]</white> <gray>- disguise block: named, looked at, or held"
    - "<white>/ph removeblock | blocks <arena-name></white> <gray>- remove a block / show the set"
    - "<white>/ph set <arena-name> <key-name> [value]</white> <gray>- arena setting, no value resets it"
    - "<white>/ph enable | disable | info | delete <arena-name></white>"
    - "<white>/ph start | stop <arena-name></white> <gray>- start or stop a round"
    - "<white>/ph reload</white> <gray>- reload config.yml and arenas"
game:
