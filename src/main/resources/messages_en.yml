  seek-started: "<pfx><red>The hunters are out!</red> Props have <white><time></white>."
  auto-taunt: "<pfx><gray>The props gave themselves away with a sound."
  stopped: "<pfx><red>The round was stopped by an admin."
  found: "<pfx><white><prop></white> was found by <white><hunter></white>!"
  found-alone: "<pfx><white><prop></white> is out."
  out-of-bounds: "<red>You cannot go further - this is the edge of the map."
  nobody: "nobody"
  winner-props: "<green>the props win</green>"
  winner-hunters: "<red>the hunters win</red>"
  summary:
    - "<gold>Round over: <winner>"
    - "<gray>Hunters (props found): <white><hunters></white>"
    - "<gray>Never found: <white><survivors></white>"
